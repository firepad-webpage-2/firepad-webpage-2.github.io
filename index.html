	  function sendFirepadText(event) {

	    const text = getCurrentEditorText();

	      {
	        type: "firepad-text",
	        requestId,
	        paperId: requestedPaperId,
	        documentId: requestedPaperId,
	        text,
	        missingReferences
	      },

	    );
	  }

window.addEventListener("message", function(event) {
  const allowedOrigins = new Set([
    "http://127.0.0.1:3000",

  "https://alphaxiv-blog-editing-dvc8fndpfbgrg3ar.centralus-01.azurewebsites.net"
  ]);

	  if (!allowedOrigins.has(event.origin)) return;

	});

let firepadReady = false;
	  /**************************************************
	   * 5. Markdown Preview
	   **************************************************/
		  const previewEl = document.getElementById("preview");
		  const imagePicker = document.querySelector(".image-picker");
			  const imagePickerButton = document.getElementById("image-picker-button");
				  const imageMenu = document.getElementById("image-menu");
					  const insertImageButton = document.getElementById("insert-image");
					  const figureWarning = document.getElementById("figure-warning");
						  const figureNotification = document.getElementById("figure-notification");
						  const imagePreviewImg = document.getElementById("image-preview-img");
				  const imagePreviewLabel = document.getElementById("image-preview-label");
				//   const originalPaperLink = document.getElementById("original-paper-link");
				//   const alphaxivBlogLink = document.getElementById("alphaxiv-blog-link");
		  let imageOptions = [];
		  let selectedImageUrl = "";
			  let figureMarks = [];
				  let previousFigureLabels = new Set();
			  let figureWarningReady = false;
				  let figureNotificationTimer = null;
				  let lastRenderedCursorLine = null;
				  let allowImageMarkdownChange = false;
				  let mathTypesetRetry = null;

	  const mdParser = window.markdownit({
	    html: false,
	    linkify: true,
	    breaks: true
	  });

	  function escapeMathHtml(text) {
	    return text.replace(/[&<>]/g, char => ({
	      "&": "&amp;",
	      "<": "&lt;",
	      ">": "&gt;"
	    }[char]));
	  }

	  function renderMarkdownWithMath(md, figureLabels) {
	    const mathBlocks = [];
	    const inlineMath = [];
	    const protectedMd = md.replace(/\$\$([\s\S]*?)\$\$/g, (match, tex) => {
	      const token = `@@MATH_BLOCK_${mathBlocks.length}@@`;
	      mathBlocks.push(`<div class="math-block">\\[${escapeMathHtml(tex.trim())}\\]</div>`);
	      return token;
	    }).replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (match, prefix, tex) => {
	      const token = `@@INLINE_MATH_${inlineMath.length}@@`;
	      inlineMath.push(`\\(${escapeMathHtml(tex.trim())}\\)`);
	      return `${prefix}${token}`;
	    });

	    let html = mdParser.render(linkFigureReferences(protectedMd, figureLabels));
	    mathBlocks.forEach((mathHtml, index) => {
	      const token = `@@MATH_BLOCK_${index}@@`;
	      html = html.replace(`<p>${token}</p>`, mathHtml).replace(token, mathHtml);
	    });
	    inlineMath.forEach((mathHtml, index) => {
	      html = html.replaceAll(`@@INLINE_MATH_${index}@@`, mathHtml);
	    });

	    return html;
	  }

	  function typesetPreviewMath() {
	    if (!window.MathJax || !window.MathJax.typesetPromise) {
	      if (!mathTypesetRetry) {
	        mathTypesetRetry = setTimeout(() => {
	          mathTypesetRetry = null;
	          typesetPreviewMath();
	        }, 250);
	      }
	      return;
	    }

	    if (window.MathJax.typesetClear) {
	      window.MathJax.typesetClear([previewEl]);
	    }
	    window.MathJax.typesetPromise([previewEl]).catch(() => {});
	  }

		 function renderPreview() {
		  const md = firepadReady
		    ? firepad.getText()   // safe after ready
		    : cm.getValue();      // safe before ready
		  lastRenderedCursorLine = cm.getCursor().line;

		  const figureLabels = getFigureLabels(md);
		  previewEl.innerHTML = renderMarkdownWithMath(md, figureLabels);
		  applyFigureLabels(figureLabels);
		  highlightFigureMarkup(md, figureLabels);
		  updateFigureWarnings(md, figureLabels);
		  updateImageOptions(md);
		  typesetPreviewMath();
		//   updateOriginalPaperLink(md);
		}

		function getPaperId(md) {
		  return getPaperIdFromUrl()
		    || (md.match(/paper-assets\.alphaxiv\.org\/(?:figures-normalized\/)?figures\/([^/\s)]+)/) || [])[1]?.replace(/v\d+$/, "")
		    || "";
		}

	function getPaperIdFromUrl() {
	  return urlParams.get("paperId")
	    || urlParams.get("paperid")
	    || urlParams.get("paper_id")
	    || urlParams.get("paper")
	    || urlParams.get("arxivId")
	    || urlParams.get("arxiv_id")
	    || "";
	}

	function getFirebaseKeyForPaperId(paperId) {
	  return paperId.replace(/[.#$/[\]]/g, "_");
	}

	function getMarkdownPathForPaperId(paperId) {
	  return /^\d{4}\.\d{4,5}(?:v\d+)?$/.test(paperId) ? `/markdown_norm/${paperId}.md` : "/test.md";
	}

	// function updateOriginalPaperLink(md) {
	//   const paperId = getPaperId(md);
	//   if (!paperId) {
	//     originalPaperLink.removeAttribute("href");
	//     alphaxivBlogLink.removeAttribute("href");
	//     return;
	//   }

	//   originalPaperLink.href = `https://arxiv.org/pdf/${paperId}`;
	//   alphaxivBlogLink.href = `https://www.alphaxiv.org/overview/${paperId}`;
	// }

	function imageExists(url) {
	  return new Promise(resolve => {
	    const img = new Image();
	    img.onload = () => resolve(true);
	    img.onerror = () => resolve(false);
	    img.src = url;
	  });
	}

			let activeImageSignature = "";
			let probingImages = false;
			async function updateImageOptions(md) {
			  const markdownImages = getMarkdownImages(md);
			  const imageSignature = markdownImages.map(image => image.url).join("|");
			  if (!imageSignature) {
			    activeImageSignature = "";
			    imageOptions = [];
			    selectedImageUrl = "";
			    renderImageMenu();
			    updateImagePreview("");
			    return;
			  }
			  if (imageSignature === activeImageSignature || probingImages) return;

			  activeImageSignature = imageSignature;
			  probingImages = true;
			  imageMenu.innerHTML = '<span class="image-menu-item loading">Loading images...</span>';

			  try {
				    const discoveredImages = sortDiscoveredImages(await discoverImageOptionsFromMarkdown(markdownImages));

			    imageOptions = discoveredImages.map((image, index) => ({
			      url: image.url,
			      label: getImageFileName(image.url) || image.label || `figure${index + 1}`
			    }));
			    selectedImageUrl = imageOptions[0]?.url || "";
			    renderImageMenu();
			    updateImagePreview(selectedImageUrl);
			  } finally {
			    probingImages = false;
			  }
				}

		function getMarkdownImages(md) {
		  const images = [];
		  const seen = new Set();
		  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
		  let match;

		  while ((match = imagePattern.exec(md))) {
		    const url = match[2].trim();
		    if (!url || seen.has(url)) continue;
		    seen.add(url);
		    images.push({
		      label: match[1].trim() || getImageFileName(url),
		      url
		    });
		  }

		  return images;
		}

		function getImageFileName(url) {
		  return decodeURIComponent((url.split(/[?#]/)[0].split("/").pop() || "").trim());
		}

		function getImageSequenceParts(url) {
		  const cleanUrl = url.split(/[?#]/)[0];
		  const match = cleanUrl.match(/^(.*\/)(x|img-)(\d+)(\.[a-z0-9]+)$/i);
		  if (!match) return null;

			  return {
			    prefix: `${match[1]}${match[2]}`,
			    suffix: match[4],
			    number: Number(match[3]),
			    startsAtZero: Number(match[3]) === 0
			  };
			}

			function sortDiscoveredImages(images) {
			  return [...images].sort((a, b) => {
			    const aSequence = getImageSequenceParts(a.url);
			    const bSequence = getImageSequenceParts(b.url);

			    if (aSequence && bSequence) {
			      const aGroup = `${aSequence.prefix}|${aSequence.suffix}`;
			      const bGroup = `${bSequence.prefix}|${bSequence.suffix}`;
			      if (aGroup !== bGroup) return aGroup.localeCompare(bGroup);
			      return aSequence.number - bSequence.number;
			    }
			    if (aSequence) return -1;
			    if (bSequence) return 1;
			    return getImageFileName(a.url).localeCompare(getImageFileName(b.url));
			  });
			}

		async function discoverImageOptionsFromMarkdown(markdownImages) {
		  const imagesByUrl = new Map();
		  const probedSequences = new Set();

		  markdownImages.forEach(image => {
		    imagesByUrl.set(image.url, image);
		  });

		  for (const image of markdownImages) {
		    const sequence = getImageSequenceParts(image.url);
		    if (!sequence) continue;

		    const start = sequence.startsAtZero ? 0 : 1;
		    const sequenceKey = `${sequence.prefix}|${sequence.suffix}|${start}`;
		    if (probedSequences.has(sequenceKey)) continue;
		    probedSequences.add(sequenceKey);

		    for (let i = start; i <= 50; i++) {
		      const url = `${sequence.prefix}${i}${sequence.suffix}`;
		      if (imagesByUrl.has(url)) continue;
		      if (!(await imageExists(url))) {
		        if (i > start) break;
		        continue;
		      }
		      imagesByUrl.set(url, {
		        label: getImageFileName(url),
		        url
		      });
		    }
		  }

		  return Array.from(imagesByUrl.values());
		}

		function renderImageMenu() {
		  imagePickerButton.textContent = imageOptions.find(option => option.url === selectedImageUrl)?.label || "Images";
		  imageMenu.innerHTML = "";

		  if (!imageOptions.length) {
		    imageMenu.innerHTML = '<span class="image-menu-item loading">No images found</span>';
		    return;
		  }

					imageOptions.forEach(option => {
						const item = document.createElement("button");
						item.type = "button";
						item.className = `image-menu-item${option.url === selectedImageUrl ? " active" : ""}`;
						item.textContent = option.label;
						item.addEventListener("mouseenter", () => { updateImagePreview(option.url); positionImageMenu(imagePickerButton); positionImagePreviewPopover(imagePickerButton); });
						item.addEventListener("focus", () => { updateImagePreview(option.url); positionImageMenu(imagePickerButton); positionImagePreviewPopover(imagePickerButton); });
						item.addEventListener("click", () => {
							selectedImageUrl = option.url;
							imagePicker.classList.remove("open", "previewing");
							renderImageMenu();
						});
						imageMenu.appendChild(item);
					});
		}

	function getOriginalFigureNumber(url) {
	  const number = (url.match(/\/x(\d+)\.png$/) || [])[1];
	  return number || "";
	}

	function getImageKey(url) {
	  const match = url.match(/paper-assets\.alphaxiv\.org\/figures\/([^/\s)]+)\/x(\d+)\.png/);
	  return match ? `${match[1]}/x${match[2]}` : url;
	}

	function getInsertedAltText(url) {
	  const number = getOriginalFigureNumber(url);
	  return number ? `original-figure-${number}` : "original-figure";
	}

	function slugifyLabel(text) {
	  return text
	    .trim()
	    .toLowerCase()
	    .replace(/[^a-z0-9]+/g, "-")
	    .replace(/^-+|-+$/g, "");
	}

	function getFigureLabel(altText, url) {
	  return slugifyLabel(altText) || (getOriginalFigureNumber(url) ? `original-figure-${getOriginalFigureNumber(url)}` : "");
	}

	function makeUniqueLabel(label, counts) {
	  if (!label) return "";
	  counts[label] = (counts[label] || 0) + 1;
	  return counts[label] === 1 ? label : `${label}-${counts[label]}`;
	}

	function getFigureLabels(md) {
	  const labels = [];
	  const labelsByKey = {};
	  const counts = {};
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    const key = getImageKey(match[2]);
	    if (!labelsByKey[key]) {
	      labelsByKey[key] = {
	        label: makeUniqueLabel(getFigureLabel(match[1], match[2]), counts),
	        number: Object.keys(labelsByKey).length + 1,
	        key
	      };
	    }
	    labels.push(labelsByKey[key]);
	  }

	  return labels;
	}

	function getLineStarts(text) {
	  const starts = [0];
	  for (let i = 0; i < text.length; i++) {
	    if (text[i] === "\n") starts.push(i + 1);
	  }
	  return starts;
	}

	function indexToPos(index, lineStarts) {
	  let low = 0;
	  let high = lineStarts.length - 1;

	  while (low <= high) {
	    const mid = Math.floor((low + high) / 2);
	    if (lineStarts[mid] <= index) {
	      low = mid + 1;
	    } else {
	      high = mid - 1;
	    }
	  }

	  return { line: high, ch: index - lineStarts[high] };
	}

	function posToIndex(pos, lineStarts) {
	  return lineStarts[pos.line] + pos.ch;
	}

	function getImageMarkdownRanges(md) {
	  const ranges = [];
	  const imagePattern = /!\[[^\]]*\]\([^)]+\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    const labelStart = match.index + 2;
	    const labelEnd = labelStart + (match[0].match(/^!\[([^\]]*)\]/) || ["", ""])[1].length;
	    ranges.push({
	      start: match.index,
	      end: match.index + match[0].length,
	      labelStart,
	      labelEnd
	    });
	  }

	  return ranges;
	}

	function changeTouchesRange(start, end, range) {
	  if (start === end) return start > range.start && start < range.end;
	  return start < range.end && end > range.start;
	}

	function isWholeImageDeletion(start, end, replacementText, overlappedRanges) {
	  return replacementText === "" && overlappedRanges.every(range => start <= range.start && end >= range.end);
	}

	function isImageLabelEdit(start, end, replacementText, overlappedRanges) {
	  if (replacementText.includes("\n")) return false;
	  return overlappedRanges.every(range => {
	    if (start === end) {
	      return start >= range.labelStart && start <= range.labelEnd;
	    }
	    return start >= range.labelStart && end <= range.labelEnd;
	  });
	}

	function guardImageMarkdownEdit(change) {
	  if (allowImageMarkdownChange) return;

	  const md = cm.getValue();
	  const lineStarts = getLineStarts(md);
	  const start = posToIndex(change.from, lineStarts);
	  const end = posToIndex(change.to, lineStarts);
	  const replacementText = change.text.join("\n");
	  const overlappedRanges = getImageMarkdownRanges(md).filter(range => changeTouchesRange(start, end, range));

	  if (!overlappedRanges.length) return;
	  if (isWholeImageDeletion(start, end, replacementText, overlappedRanges)) return;
	  if (isImageLabelEdit(start, end, replacementText, overlappedRanges)) return;

	  change.cancel();
	  showFigureNotification("Only image labels can be edited directly. Delete the whole image markdown or use the top image dropdown.");
	}

	function withImageMarkdownGuardDisabled(fn) {
	  allowImageMarkdownChange = true;
	  try {
	    return fn();
	  } finally {
	    allowImageMarkdownChange = false;
	  }
	}

	function clearFigureMarks() {
	  figureMarks.forEach(mark => mark.clear());
	  figureMarks = [];
	}

	function addFigureMark(md, lineStarts, start, end, className) {
	  figureMarks.push(cm.markText(indexToPos(start, lineStarts), indexToPos(end, lineStarts), { className }));
	}

	function getFigureReferenceMatches(md) {
	  const refs = [];
	  const patterns = [
	    /\{fig:([^}]+)\}/g,
	    /\\ref\{fig:([^}]+)\}/g
	  ];

	  patterns.forEach(pattern => {
	    let match;
	    while ((match = pattern.exec(md))) {
	      refs.push({
	        label: match[1],
	        start: match.index,
	        end: match.index + match[0].length
	      });
	    }
	  });

	  return refs;
	}

	function getUniqueFigures(figureLabels) {
	  return Array.from(new Map(figureLabels.map(figure => [figure.label, figure])).values());
	}

	function getCursorIndex(md) {
	  const lineStarts = getLineStarts(md);
	  return posToIndex(cm.getCursor(), lineStarts);
	}

	function rangesOverlap(a, b) {
	  return a.start < b.end && b.start < a.end;
	}

	function getActiveFigureReferenceLineRange(md, cursorIndex) {
	  const prefixes = ["\\ref{fig:", "{fig:"];
	  const lineStart = md.lastIndexOf("\n", Math.max(0, cursorIndex - 1)) + 1;
	  const lineEndIndex = md.indexOf("\n", cursorIndex);
	  const lineEnd = lineEndIndex === -1 ? md.length : lineEndIndex;
	  const lineText = md.slice(lineStart, lineEnd);
	  const hasFigureReference = prefixes.some(prefix => lineText.includes(prefix));

	  return hasFigureReference ? { start: lineStart, end: lineEnd } : null;
	}

	function isCursorEditingReference(ref, activeReferenceLineRange) {
	  return activeReferenceLineRange && rangesOverlap(ref, activeReferenceLineRange);
	}

	function showFigureNotification(message) {
	  if (figureNotificationTimer) {
	    clearTimeout(figureNotificationTimer);
	  }

	  figureNotification.textContent = `Warning: ${message}`;
	  figureNotification.classList.add("active");
	  figureNotificationTimer = setTimeout(() => {
	    figureNotification.classList.remove("active");
	    figureNotificationTimer = null;
	  }, 4500);
	}

	function getOrphanFigureReferences(md, figureLabels, ignoreActiveReference = false) {
	  const knownLabels = new Set(figureLabels.map(figure => figure.label));
	  const activeReferenceLineRange = ignoreActiveReference
	    ? getActiveFigureReferenceLineRange(md, getCursorIndex(md))
	    : null;

	  return getFigureReferenceMatches(md).filter(ref => {
	    if (knownLabels.has(ref.label)) return false;
	    if (ignoreActiveReference && isCursorEditingReference(ref, activeReferenceLineRange)) return false;
	    return true;
	  });
	}

	function highlightFigureMarkup(md, figureLabels) {
	  clearFigureMarks();
	  const lineStarts = getLineStarts(md);
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let imageMatch;
	  let figureIndex = 0;

	  cm.operation(() => {
	    while ((imageMatch = imagePattern.exec(md))) {
	      const figure = figureLabels[figureIndex];
	      const colorIndex = figure ? (figure.number - 1) % 8 : figureIndex % 8;
	      addFigureMark(md, lineStarts, imageMatch.index, imageMatch.index + imageMatch[0].length, `cm-figure-image-${colorIndex}`);
	      figureIndex++;
	    }

	    getUniqueFigures(figureLabels).forEach(({ label, number }) => {
	      if (!label) return;
	      const labelPattern = escapeRegExp(label);
	      const patterns = [
	        new RegExp(`\\{fig:${labelPattern}\\}`, "g"),
	        new RegExp(`\\\\ref\\{fig:${labelPattern}\\}`, "g")
	      ];

	      patterns.forEach(pattern => {
	        let refMatch;
	        while ((refMatch = pattern.exec(md))) {
	          addFigureMark(md, lineStarts, refMatch.index, refMatch.index + refMatch[0].length, `cm-figure-ref-${(number - 1) % 8}`);
	        }
	      });
	    });

	    getOrphanFigureReferences(md, figureLabels, true).forEach(ref => {
	      addFigureMark(md, lineStarts, ref.start, ref.end, "cm-figure-orphan");
	    });
	  });
	}

	function updateFigureWarnings(md, figureLabels) {
	  const orphanLabels = Array.from(new Set(getOrphanFigureReferences(md, figureLabels, true).map(ref => ref.label)));
	  const currentFigureLabels = new Set(getUniqueFigures(figureLabels).map(figure => figure.label));
	  const removedLabels = Array.from(previousFigureLabels).filter(label => !currentFigureLabels.has(label));
	  const removedLabelsWithRefs = orphanLabels.filter(label => removedLabels.includes(label));

	  if (figureWarningReady && removedLabelsWithRefs.length) {
	    showFigureNotification(
	      removedLabelsWithRefs.length === 1
	        ? `Missing reference for img: ${removedLabelsWithRefs[0]}`
	        : `Missing reference for imgs: ${removedLabelsWithRefs.join(", ")}`
	    );
	  }

	  if (!orphanLabels.length) {
	    figureWarning.classList.remove("active");
	    figureWarning.textContent = "";
	    figureWarning.title = "";
	    previousFigureLabels = currentFigureLabels;
	    figureWarningReady = true;
	    return;
	  }

	  figureWarning.classList.add("active");
	  figureWarning.textContent = orphanLabels.length === 1
	    ? `Missing reference for img: ${orphanLabels[0]}`
	    : `${orphanLabels.length} missing img references`;
	  figureWarning.title = `Missing reference for imgs: ${orphanLabels.join(", ")}`;
	  previousFigureLabels = currentFigureLabels;
	  figureWarningReady = true;
	}

	function escapeRegExp(text) {
	  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
	}

	function linkFigureReferences(html, figureLabels) {
	  let nextHtml = html;

	  figureLabels.forEach(({ label, number }) => {
	    if (!label) return;
	    const labelPattern = escapeRegExp(label);
	    const patterns = [
	      new RegExp(`\\{fig:${labelPattern}\\}`, "g"),
	      new RegExp(`\\\\ref\\{fig:${labelPattern}\\}`, "g")
	    ];
	    patterns.forEach(pattern => {
	      nextHtml = nextHtml.replace(pattern, `[Figure ${number}](#${label})`);
	    });
	  });

	  return nextHtml;
	}

	function applyFigureLabels(figureLabels) {
	  previewEl.querySelectorAll("img").forEach((img, index) => {
	    const label = figureLabels[index]?.label;
	    if (!label) return;

	    img.id = label;
	    img.dataset.figureLabel = label;
	    img.title = `Figure label: ${label}`;
	  });
	}

	function positionImagePreviewPopover(anchorEl) {
		const pop = document.getElementById("image-preview-popover");
		if (!anchorEl || !pop) return;
		const menu = document.getElementById("image-menu");
		const rect = menu && imagePicker.classList.contains("open")
			? menu.getBoundingClientRect()
			: anchorEl.getBoundingClientRect();
		const popWidth = Math.min(320, Math.floor(window.innerWidth * 0.42));

			let left = rect.right + 10;
			if (left + popWidth > window.innerWidth - 8) {
				left = rect.left - popWidth - 10;
			}
			if (left < 8) left = 8;

			const popHeight = pop.offsetHeight || 220;
			let top = rect.top;
			if (top + popHeight > window.innerHeight - 8) {
				top = Math.max(8, window.innerHeight - popHeight - 8);
			}

			pop.style.left = `${Math.round(left)}px`;
			pop.style.top = `${Math.round(top)}px`;
	}

	function updateImagePreview(url) {
		const option = imageOptions.find(item => item.url === url);

		imagePreviewImg.src = option?.url || "";
		imagePreviewImg.alt = option?.label || "";
		imagePreviewLabel.textContent = option ? option.label : "No image selected";
		imagePicker.classList.toggle("previewing", Boolean(option));

		// Reposition the fixed popover when visible
		if (imagePicker.classList.contains("open") && imagePicker.classList.contains("previewing")) {
			// wait for layout to settle
			requestAnimationFrame(() => {
				positionImageMenu(imagePickerButton);
				positionImagePreviewPopover(imagePickerButton);
			});
		}
	}

	function positionImageMenu(anchorEl) {
		const menu = document.getElementById("image-menu");
		if (!anchorEl || !menu) return;
		const rect = anchorEl.getBoundingClientRect();
		const menuWidth = Math.max(180, menu.offsetWidth || 180);

		// Align menu so it stays within viewport and below the anchor
		let left = rect.left;
		if (left + menuWidth > window.innerWidth - 8) left = window.innerWidth - menuWidth - 8;
		if (left < 8) left = 8;

		let top = rect.bottom + 6;
		const menuHeight = Math.min(280, menu.offsetHeight || 220);
		if (top + menuHeight > window.innerHeight - 8) {
			const above = rect.top - menuHeight - 6;
			if (above >= 8) top = above;
			else top = Math.max(8, window.innerHeight - menuHeight - 8);
		}

		menu.style.left = `${Math.round(left)}px`;
		menu.style.top = `${Math.round(top)}px`;
	}

	function getExistingAltTextForUrl(md, url) {
	  const targetKey = getImageKey(url);
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    if (getImageKey(match[2]) === targetKey && match[1].trim()) {
	      return getFigureLabel(match[1], match[2]);
	    }
	  }

	  return "";
	}

	async function loadInitialMarkdown() {
	  try {
	    const paperId = getPaperId("");
	    const res = await fetch(getMarkdownPathForPaperId(paperId), { cache: "no-store" });
	    if (!res.ok) return "";
	    const md = await res.text();
	    return window.FigureMarkdownNormalizer
	      ? window.FigureMarkdownNormalizer.normalizeInitialMarkdown(md)
	      : md;
	  } catch (error) {
	    return "";
	  }
	}

	insertImageButton.addEventListener("click", function() {
	  const url = selectedImageUrl;
	  if (!url) return;

	  const md = firepadReady ? firepad.getText() : cm.getValue();
	  const imageAltText = getExistingAltTextForUrl(md, url) || getInsertedAltText(url);
	  withImageMarkdownGuardDisabled(() => {
	    cm.replaceSelection(`![${imageAltText}](${url})`);
	  });
	  cm.focus();
	});

	imagePickerButton.addEventListener("click", function() {
	imagePicker.classList.toggle("open");
	updateImagePreview(selectedImageUrl);
	// Position the fixed popover below the insert button when opening
	if (imagePicker.classList.contains("open")) {
	    requestAnimationFrame(() => {
	      positionImageMenu(imagePickerButton);
	      positionImagePreviewPopover(imagePickerButton);
	    });
	}
	});

	document.addEventListener("click", function(event) {
	  if (imagePicker.contains(event.target)) return;
	  imagePicker.classList.remove("open", "previewing");
	});

	// Reposition on resize/scroll to keep menu/popover aligned
	window.addEventListener("resize", () => {
		if (imagePicker.classList.contains("open")) {
			positionImageMenu(imagePickerButton);
			positionImagePreviewPopover(imagePickerButton);
		}
	});
	window.addEventListener("scroll", () => {
		if (imagePicker.classList.contains("open")) {
			positionImageMenu(imagePickerButton);
			positionImagePreviewPopover(imagePickerButton);
		}
	}, { passive: true });

	  /**************************************************
	   * 6. Firepad Ready
	   **************************************************/
		  firepad.on("ready", async function() {
		    firepadReady=true;
		    const existing = firepad.getText();
		    if (!existing || !existing.trim()) {
		      const md = await loadInitialMarkdown();
		      if (md) {
		        withImageMarkdownGuardDisabled(() => {
		          firepad.setText(md);
		        });
		      }
		    }
		    renderPreview();
		  });

  

	  /**************************************************
	   * 7. Live Preview Updates
	   **************************************************/
	  cm.on("beforeChange", function(instance, change) {
	    guardImageMarkdownEdit(change);
	  });

		  cm.on("change", function() {
		    renderPreview();
		  });

		  cm.on("cursorActivity", function() {
		    const cursorLine = cm.getCursor().line;
		    if (cursorLine === lastRenderedCursorLine) return;
		    renderPreview();
		  });

}
</script>
