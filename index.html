    <script>
        function init() {
            const urlParams = new URLSearchParams(window.location.search);


            const firebaseConfig = {
                apiKey: "AIzaSyCqJWZdST2-HsSDMMPev3ssFKThTxqd-Jc",
                authDomain: "firepad-blog.firebaseapp.com",
                databaseURL: "https://firepad-blog-default-rtdb.firebaseio.com",
                projectId: "firepad-blog",
                storageBucket: "firepad-blog.firebasestorage.app",
                messagingSenderId: "303450527439",
                appId: "1:303450527439:web:f1de9818912de33f0d49ba",
                measurementId: "G-PR1BMSW9QY"
            };
            const app = firebase.initializeApp(firebaseConfig);


    //         const firepadRef = app.database()
    // .ref("firepad")
    // .child("markdown-test-room");
    const documentId = urlParams.get("documentId") || "markdown-test-room";

    const firepadRef = app.database()
      .ref("firepad")
      .child(documentId);

  /**************************************************
   * 3. CodeMirror (Markdown mode)
   **************************************************/
  const cm = CodeMirror(document.getElementById("editor"), {
    lineNumbers: true,
    lineWrapping: true,
    mode: "markdown",
    value: ""
  });

  /**************************************************
   * 4. Firepad (NO firepad.init())
   **************************************************/
  const firepad = Firepad.fromCodeMirror(firepadRef, cm, {
    richTextToolbar: false,
    richTextShortcuts: false
  });
  function sendFirepadText(requestId, targetOrigin) {
  if (!firepadReady) return;

  window.parent.postMessage(
    {
      type: "firepad-text",
      documentId,
      requestId,
      text: firepad.getText()
    },
    targetOrigin
  );
}

window.addEventListener("message", function(event) {
  const allowedOrigins = new Set([
    "http://127.0.0.1:3000",
    "http://localhost:3000"
  ]);

  if (!allowedOrigins.has(event.origin)) return;
  if (event.data?.type !== "request-firepad-text") return;

  sendFirepadText(event.data.requestId, event.origin);
});

let firepadReady = false;
	  /**************************************************
	   * 5. Markdown Preview
	   **************************************************/
		  const previewEl = document.getElementById("preview");
		  const imagePicker = document.querySelector(".image-picker");
		  const imagePickerButton = document.getElementById("image-picker-button");
		  const imageMenu = document.getElementById("image-menu");
			  const insertImageButton = document.getElementById("insert-image");
			  const renumberFiguresButton = document.getElementById("renumber-figures");
			  const figureWarning = document.getElementById("figure-warning");
			  const imagePreviewImg = document.getElementById("image-preview-img");
		  const imagePreviewLabel = document.getElementById("image-preview-label");
		  let imageOptions = [];
		  let selectedImageUrl = "";
		  let figureMarks = [];
		  let previousOrphanLabels = new Set();
		  let figureWarningReady = false;
		  let allowImageMarkdownChange = false;

  const mdParser = window.markdownit({
    html: false,
    linkify: true,
    breaks: true
  });

	 function renderPreview() {
	  const md = firepadReady
	    ? firepad.getText()   // safe after ready
	    : cm.getValue();      // safe before ready

	  const figureLabels = getFigureLabels(md);
	  previewEl.innerHTML = mdParser.render(linkFigureReferences(md, figureLabels));
	  applyFigureLabels(figureLabels);
	  highlightFigureMarkup(md, figureLabels);
	  updateFigureWarnings(md, figureLabels);
	  updateImageOptions(md);
	}

	function getPaperId(md) {
	  return urlParams.get("paperId")
	    || urlParams.get("paper")
	    || (md.match(/paper-assets\.alphaxiv\.org\/figures\/([^/\s)]+)\/x\d+\.png/) || [])[1]
	    || "";
	}

	function imageExists(url) {
	  return new Promise(resolve => {
	    const img = new Image();
	    img.onload = () => resolve(true);
	    img.onerror = () => resolve(false);
	    img.src = url;
	  });
	}

		let activePaperId = "";
		let probingImages = false;
		async function updateImageOptions(md) {
		  const paperId = getPaperId(md);
		  if (!paperId || paperId === activePaperId || probingImages) return;

		  activePaperId = paperId;
		  probingImages = true;
		  imageMenu.innerHTML = '<span class="image-menu-item loading">Loading images...</span>';

		  const urls = [];
		  for (let i = 1; i <= 50; i++) {
		    const url = `https://paper-assets.alphaxiv.org/figures/${paperId}/x${i}.png`;
		    if (!(await imageExists(url))) break;
		    urls.push(url);
		  }

		  imageOptions = urls.map((url, index) => ({
		    url,
		    label: `figure${index + 1}.png`
		  }));
		  selectedImageUrl = imageOptions[0]?.url || "";
		  renderImageMenu();
		  probingImages = false;
		  updateImagePreview(selectedImageUrl);
		}

		function renderImageMenu() {
		  imagePickerButton.textContent = imageOptions.find(option => option.url === selectedImageUrl)?.label || "Images";
		  imageMenu.innerHTML = "";

		  if (!imageOptions.length) {
		    imageMenu.innerHTML = '<span class="image-menu-item loading">No images found</span>';
		    return;
		  }

		  imageOptions.forEach(option => {
		    const item = document.createElement("button");
		    item.type = "button";
		    item.className = `image-menu-item${option.url === selectedImageUrl ? " active" : ""}`;
		    item.textContent = option.label;
		    item.addEventListener("mouseenter", () => updateImagePreview(option.url));
		    item.addEventListener("focus", () => updateImagePreview(option.url));
		    item.addEventListener("click", () => {
		      selectedImageUrl = option.url;
		      imagePicker.classList.remove("open", "previewing");
		      renderImageMenu();
		    });
		    imageMenu.appendChild(item);
		  });
		}

	function getOriginalFigureNumber(url) {
	  const number = (url.match(/\/x(\d+)\.png$/) || [])[1];
	  return number || "";
	}

	function getImageKey(url) {
	  const match = url.match(/paper-assets\.alphaxiv\.org\/figures\/([^/\s)]+)\/x(\d+)\.png/);
	  return match ? `${match[1]}/x${match[2]}` : url;
	}

	function getInsertedAltText(url) {
	  const number = getOriginalFigureNumber(url);
	  return number ? `original-figure-${number}` : "original-figure";
	}

	function slugifyLabel(text) {
	  return text
	    .trim()
	    .toLowerCase()
	    .replace(/[^a-z0-9]+/g, "-")
	    .replace(/^-+|-+$/g, "");
	}

	function getFigureLabel(altText, url) {
	  return slugifyLabel(altText) || (getOriginalFigureNumber(url) ? `original-figure-${getOriginalFigureNumber(url)}` : "");
	}

	function makeUniqueLabel(label, counts) {
	  if (!label) return "";
	  counts[label] = (counts[label] || 0) + 1;
	  return counts[label] === 1 ? label : `${label}-${counts[label]}`;
	}

	function getFigureLabels(md) {
	  const labels = [];
	  const labelsByKey = {};
	  const counts = {};
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    const key = getImageKey(match[2]);
	    if (!labelsByKey[key]) {
	      labelsByKey[key] = {
	        label: makeUniqueLabel(getFigureLabel(match[1], match[2]), counts),
	        number: Object.keys(labelsByKey).length + 1,
	        key
	      };
	    }
	    labels.push(labelsByKey[key]);
	  }

	  return labels;
	}

	function getFigureMetadata(md) {
	  const labels = [];
	  const labelsByKey = {};
	  const counts = {};
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    const afterImage = md.slice(match.index + match[0].length);
	    const captionMatch = afterImage.match(/^\s*\n\s*\*{0,2}Figure\s+(\d+)\s*:/i);
	    const key = getImageKey(match[2]);

	    if (!labelsByKey[key]) {
	      labelsByKey[key] = {
	        label: makeUniqueLabel(getFigureLabel(match[1], match[2]), counts),
	        number: Object.keys(labelsByKey).length + 1,
	        captionNumber: captionMatch ? Number(captionMatch[1]) : Object.keys(labelsByKey).length + 1,
	        key
	      };
	    }
	    labels.push(labelsByKey[key]);
	  }

	  return labels;
	}

	function getLineStarts(text) {
	  const starts = [0];
	  for (let i = 0; i < text.length; i++) {
	    if (text[i] === "\n") starts.push(i + 1);
	  }
	  return starts;
	}

	function indexToPos(index, lineStarts) {
	  let low = 0;
	  let high = lineStarts.length - 1;

	  while (low <= high) {
	    const mid = Math.floor((low + high) / 2);
	    if (lineStarts[mid] <= index) {
	      low = mid + 1;
	    } else {
	      high = mid - 1;
	    }
	  }

	  return { line: high, ch: index - lineStarts[high] };
	}

	function posToIndex(pos, lineStarts) {
	  return lineStarts[pos.line] + pos.ch;
	}

	function getImageMarkdownRanges(md) {
	  const ranges = [];
	  const imagePattern = /!\[[^\]]*\]\([^)]+\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    ranges.push({
	      start: match.index,
	      end: match.index + match[0].length
	    });
	  }

	  return ranges;
	}

	function changeOverlapsRange(start, end, range) {
	  return start < range.end && end > range.start;
	}

	function isWholeImageDeletion(start, end, replacementText, overlappedRanges) {
	  return replacementText === "" && overlappedRanges.every(range => start <= range.start && end >= range.end);
	}

	function guardImageMarkdownEdit(change) {
	  if (allowImageMarkdownChange) return;

	  const md = cm.getValue();
	  const lineStarts = getLineStarts(md);
	  const start = posToIndex(change.from, lineStarts);
	  const end = posToIndex(change.to, lineStarts);
	  const replacementText = change.text.join("\n");
	  const overlappedRanges = getImageMarkdownRanges(md).filter(range => changeOverlapsRange(start, end, range));

	  if (!overlappedRanges.length) return;
	  if (isWholeImageDeletion(start, end, replacementText, overlappedRanges)) return;

	  change.cancel();
	  window.alert("Image markdown cannot be edited directly. Delete the whole image markdown or use the top image dropdown.");
	}

	function withImageMarkdownGuardDisabled(fn) {
	  allowImageMarkdownChange = true;
	  try {
	    return fn();
	  } finally {
	    allowImageMarkdownChange = false;
	  }
	}

	function clearFigureMarks() {
	  figureMarks.forEach(mark => mark.clear());
	  figureMarks = [];
	}

	function addFigureMark(md, lineStarts, start, end, className) {
	  figureMarks.push(cm.markText(indexToPos(start, lineStarts), indexToPos(end, lineStarts), { className }));
	}

	function getFigureReferenceMatches(md) {
	  const refs = [];
	  const patterns = [
	    /\{fig:([^}]+)\}/g,
	    /\\ref\{fig:([^}]+)\}/g
	  ];

	  patterns.forEach(pattern => {
	    let match;
	    while ((match = pattern.exec(md))) {
	      refs.push({
	        label: match[1],
	        start: match.index,
	        end: match.index + match[0].length
	      });
	    }
	  });

	  return refs;
	}

	function getUniqueFigures(figureLabels) {
	  return Array.from(new Map(figureLabels.map(figure => [figure.label, figure])).values());
	}

	function getOrphanFigureReferences(md, figureLabels) {
	  const knownLabels = new Set(figureLabels.map(figure => figure.label));
	  return getFigureReferenceMatches(md).filter(ref => !knownLabels.has(ref.label));
	}

	function highlightFigureMarkup(md, figureLabels) {
	  clearFigureMarks();
	  const lineStarts = getLineStarts(md);
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let imageMatch;
	  let figureIndex = 0;

	  cm.operation(() => {
	    while ((imageMatch = imagePattern.exec(md))) {
	      const figure = figureLabels[figureIndex];
	      const colorIndex = figure ? (figure.number - 1) % 8 : figureIndex % 8;
	      addFigureMark(md, lineStarts, imageMatch.index, imageMatch.index + imageMatch[0].length, `cm-figure-image-${colorIndex}`);
	      figureIndex++;
	    }

	    getUniqueFigures(figureLabels).forEach(({ label, number }) => {
	      if (!label) return;
	      const labelPattern = escapeRegExp(label);
	      const patterns = [
	        new RegExp(`\\{fig:${labelPattern}\\}`, "g"),
	        new RegExp(`\\\\ref\\{fig:${labelPattern}\\}`, "g")
	      ];

	      patterns.forEach(pattern => {
	        let refMatch;
	        while ((refMatch = pattern.exec(md))) {
	          addFigureMark(md, lineStarts, refMatch.index, refMatch.index + refMatch[0].length, `cm-figure-ref-${(number - 1) % 8}`);
	        }
	      });
	    });

	    getOrphanFigureReferences(md, figureLabels).forEach(ref => {
	      addFigureMark(md, lineStarts, ref.start, ref.end, "cm-figure-orphan");
	    });
	  });
	}

	function updateFigureWarnings(md, figureLabels) {
	  const orphanLabels = Array.from(new Set(getOrphanFigureReferences(md, figureLabels).map(ref => ref.label)));
	  const newOrphanLabels = orphanLabels.filter(label => !previousOrphanLabels.has(label));

	  if (figureWarningReady && newOrphanLabels.length) {
	    window.alert(
	      newOrphanLabels.length === 1
	        ? `Missing reference for img: ${newOrphanLabels[0]}`
	        : `Missing reference for imgs: ${newOrphanLabels.join(", ")}`
	    );
	  }

	  if (!orphanLabels.length) {
	    figureWarning.classList.remove("active");
	    figureWarning.textContent = "";
	    figureWarning.title = "";
	    previousOrphanLabels = new Set();
	    figureWarningReady = true;
	    return;
	  }

	  figureWarning.classList.add("active");
	  figureWarning.textContent = orphanLabels.length === 1
	    ? `Missing reference for img: ${orphanLabels[0]}`
	    : `${orphanLabels.length} missing img references`;
	  figureWarning.title = `Missing reference for imgs: ${orphanLabels.join(", ")}`;
	  previousOrphanLabels = new Set(orphanLabels);
	  figureWarningReady = true;
	}

	function escapeRegExp(text) {
	  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
	}

	function linkFigureReferences(html, figureLabels) {
	  let nextHtml = html;

	  figureLabels.forEach(({ label, number }) => {
	    if (!label) return;
	    const labelPattern = escapeRegExp(label);
	    const patterns = [
	      new RegExp(`\\{fig:${labelPattern}\\}`, "g"),
	      new RegExp(`\\\\ref\\{fig:${labelPattern}\\}`, "g")
	    ];
	    patterns.forEach(pattern => {
	      nextHtml = nextHtml.replace(pattern, `[Figure ${number}](#${label})`);
	    });
	  });

	  return nextHtml;
	}

	function applyFigureLabels(figureLabels) {
	  previewEl.querySelectorAll("img").forEach((img, index) => {
	    const label = figureLabels[index]?.label;
	    if (!label) return;

	    img.id = label;
	    img.dataset.figureLabel = label;
	    img.title = `Figure label: ${label}`;
	  });
	}

	function updateImagePreview(url) {
	  const option = imageOptions.find(item => item.url === url);

	  imagePreviewImg.src = option?.url || "";
	  imagePreviewImg.alt = option?.label || "";
	  imagePreviewLabel.textContent = option ? option.label : "No image selected";
	  imagePicker.classList.toggle("previewing", Boolean(option));
	}

	function getExistingAltTextForUrl(md, url) {
	  const targetKey = getImageKey(url);
	  const imagePattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
	  let match;

	  while ((match = imagePattern.exec(md))) {
	    if (getImageKey(match[2]) === targetKey && match[1].trim()) {
	      return getFigureLabel(match[1], match[2]);
	    }
	  }

	  return "";
	}

	function normalizeFigureAltText(md) {
	  return md.replace(/!\[([^\]]*)\]\((https:\/\/paper-assets\.alphaxiv\.org\/figures\/[^/\s)]+\/x(\d+)\.png)\)/g, (match, altText, url) => {
	    const label = getFigureLabel(altText, url);
	    return label ? `![${label}](${url})` : match;
	  });
	}

	function formatFigureReferenceList(numbers, figureLabels) {
	  const refs = numbers.map(number => {
	    const figure = figureLabels.find(item => item.captionNumber === number) || figureLabels[number - 1];
	    return figure?.label ? `{fig:${figure.label}}` : `Figure ${number}`;
	  });

	  if (refs.length <= 1) return refs[0] || "";
	  if (refs.length === 2) return `${refs[0]} and ${refs[1]}`;
	  return `${refs.slice(0, -1).join(", ")}, and ${refs[refs.length - 1]}`;
	}

	function normalizeFigureTextReferences(md) {
	  const figureLabels = getFigureMetadata(md);

	  function replaceReferences(text) {
	    return text.replace(/\b(?:Figures?|Figs?\.?)\s+(\d+(?:\s*,\s*\d+)*(?:\s*,?\s+and\s+\d+)?)/gi, (match, numberText) => {
	      const numbers = numberText.match(/\d+/g)?.map(Number) || [];
	      if (!numbers.length) return match;
	      return formatFigureReferenceList(numbers, figureLabels);
	    });
	  }

	  return md.split("\n").map(line => {
	    if (/!\[[^\]]*\]\([^)]+\)/.test(line)) return line;

	    const captionMatch = line.match(/^(\s*\*{0,2}Figure\s+\d+\s*:)(.*)$/i);
	    if (captionMatch) {
	      return `${captionMatch[1]}${replaceReferences(captionMatch[2])}`;
	    }

	    const labeledCaptionMatch = line.match(/^(\s*\*{0,2}\{fig:[^}]+\}\s*:)(.*)$/i);
	    if (labeledCaptionMatch) {
	      return `${labeledCaptionMatch[1]}${replaceReferences(labeledCaptionMatch[2])}`;
	    }

	    if (line.includes("{fig:") || line.includes("\\ref{fig:")) return line;

	    return replaceReferences(line);
	  }).join("\n");
	}

	function normalizeFigureCaptions(md) {
	  return renumberFigures(md);
	}

	function normalizeInitialMarkdown(md) {
	  return normalizeFigureCaptions(normalizeFigureTextReferences(normalizeFigureAltText(md)));
	}

	function renumberFigures(md) {
	  const lines = md.split("\n");
	  const figureLabels = getFigureLabels(md);
	  let figureNumber = 0;

	  for (let i = 0; i < lines.length; i++) {
	    if (!/!\[[^\]]*\]\([^)]+\)/.test(lines[i])) continue;

	    figureNumber++;
	    const label = figureLabels[figureNumber - 1]?.label;
	    const captionIndex = i + 1;
	    if (captionIndex < lines.length && label && /^\s*\*{0,2}(?:Figure\s+\d+|\{fig:[^}]+\})\s*:/i.test(lines[captionIndex])) {
	      lines[captionIndex] = lines[captionIndex].replace(/(\s*\*{0,2})(?:Figure\s+\d+|\{fig:[^}]+\})\s*:/i, `$1{fig:${label}}:`);
	    }
	  }

	  return lines.join("\n");
	}

	insertImageButton.addEventListener("click", function() {
	  const url = selectedImageUrl;
	  if (!url) return;

	  const md = firepadReady ? firepad.getText() : cm.getValue();
	  const imageAltText = getExistingAltTextForUrl(md, url) || getInsertedAltText(url);
	  withImageMarkdownGuardDisabled(() => {
	    cm.replaceSelection(`![${imageAltText}](${url})`);
	  });
	  cm.focus();
	});

	imagePickerButton.addEventListener("click", function() {
	  imagePicker.classList.toggle("open");
	  updateImagePreview(selectedImageUrl);
	});

	document.addEventListener("click", function(event) {
	  if (imagePicker.contains(event.target)) return;
	  imagePicker.classList.remove("open", "previewing");
	});

	renumberFiguresButton.addEventListener("click", function() {
	  const md = firepadReady ? firepad.getText() : cm.getValue();
	  const nextMd = renumberFigures(md);

	  if (nextMd === md) return;
	  withImageMarkdownGuardDisabled(() => {
	    if (firepadReady) {
	      firepad.setText(nextMd);
	    } else {
	      cm.setValue(nextMd);
	    }
	  });
	  renderPreview();
	});

  /**************************************************
   * 6. Load test.md ONLY if empty
   **************************************************/
	  firepad.on("ready", async function() {
	    firepadReady=true;
	    const existing = firepad.getText();

	    if (!existing || !existing.trim()) {
	      const res = await fetch("/test.md", { cache: "no-store" });
	      if (res.ok) {
	        const md = normalizeInitialMarkdown(await res.text());
	        withImageMarkdownGuardDisabled(() => {
	          firepad.setText(md);   // IMPORTANT: setText, not setHtml
	        });
	      }
	    } else {
	      const normalized = normalizeInitialMarkdown(existing);
	      if (normalized !== existing) {
	        withImageMarkdownGuardDisabled(() => {
	          firepad.setText(normalized);
	        });
	      }
	    }

	    renderPreview();
	  });

  

	  /**************************************************
	   * 7. Live Preview Updates
	   **************************************************/
	  cm.on("beforeChange", function(instance, change) {
	    guardImageMarkdownEdit(change);
	  });

	  cm.on("change", function() {
	    renderPreview();
	  });

}
</script>
