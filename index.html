<body onload="init()">
    <div class="wrap">
  <div class="pane">
	    <div class="header">
	      <span>Editor</span>
	      <span class="spacer"></span>
	      <select id="image-select" title="Original paper image">
	        <option value="">Images</option>
	      </select>
	      <button id="insert-image" class="primary-button" type="button">Insert image</button>
	      <button id="renumber-figures" type="button" title="Renumber image alt text and immediate captions by image order">Renumber</button>
	    </div>
    <div id="editor"></div>
  </div>
  <div class="pane">
    <div class="header">Preview</div>
    <div id="preview"></div>
  </div>
</div>

    <script>
        function init() {
            const urlParams = new URLSearchParams(window.location.search);


            const firebaseConfig = {
                apiKey: "AIzaSyCqJWZdST2-HsSDMMPev3ssFKThTxqd-Jc",
                authDomain: "firepad-blog.firebaseapp.com",
                databaseURL: "https://firepad-blog-default-rtdb.firebaseio.com",
                projectId: "firepad-blog",
                storageBucket: "firepad-blog.firebasestorage.app",
                messagingSenderId: "303450527439",
                appId: "1:303450527439:web:f1de9818912de33f0d49ba",
                measurementId: "G-PR1BMSW9QY"
            };
            const app = firebase.initializeApp(firebaseConfig);


            const firepadRef = app.database()
    .ref("firepad")
    .child("markdown-test-room");

  /**************************************************
   * 3. CodeMirror (Markdown mode)
   **************************************************/
  const cm = CodeMirror(document.getElementById("editor"), {
    lineNumbers: true,
    lineWrapping: true,
    mode: "markdown",
    value: ""
  });

  /**************************************************
   * 4. Firepad (NO firepad.init())
   **************************************************/
  const firepad = Firepad.fromCodeMirror(firepadRef, cm, {
    richTextToolbar: false,
    richTextShortcuts: false
  });
let firepadReady = false;
  /**************************************************
   * 5. Markdown Preview
   **************************************************/
	  const previewEl = document.getElementById("preview");
	  const imageSelect = document.getElementById("image-select");
	  const insertImageButton = document.getElementById("insert-image");
	  const renumberFiguresButton = document.getElementById("renumber-figures");

  const mdParser = window.markdownit({
    html: false,
    linkify: true,
    breaks: true
  });

	 function renderPreview() {
	  const md = firepadReady
	    ? firepad.getText()   // safe after ready
	    : cm.getValue();      // safe before ready

	  previewEl.innerHTML = mdParser.render(md);
	  updateImageOptions(md);
	}

	function getPaperId(md) {
	  return urlParams.get("paperId")
	    || urlParams.get("paper")
	    || (md.match(/paper-assets\.alphaxiv\.org\/figures\/([^/\s)]+)\/x\d+\.png/) || [])[1]
	    || "";
	}

	function imageExists(url) {
	  return new Promise(resolve => {
	    const img = new Image();
	    img.onload = () => resolve(true);
	    img.onerror = () => resolve(false);
	    img.src = url;
	  });
	}

	let activePaperId = "";
	let probingImages = false;
	async function updateImageOptions(md) {
	  const paperId = getPaperId(md);
	  if (!paperId || paperId === activePaperId || probingImages) return;

	  activePaperId = paperId;
	  probingImages = true;
	  imageSelect.innerHTML = '<option value="">Loading images...</option>';

	  const urls = [];
	  for (let i = 1; i <= 50; i++) {
	    const url = `https://paper-assets.alphaxiv.org/figures/${paperId}/x${i}.png`;
	    if (!(await imageExists(url))) break;
	    urls.push(url);
	  }

	  imageSelect.innerHTML = '<option value="">Images</option>';
	  urls.forEach((url, index) => {
	    const option = document.createElement("option");
	    option.value = url;
	    option.textContent = `figure${index + 1}.png`;
	    imageSelect.appendChild(option);
	  });
	  probingImages = false;
	}

	function getImageName(url) {
	  const number = (url.match(/\/x(\d+)\.png$/) || [])[1];
	  return number ? `figure${number}.png` : "figure.png";
	}

	function renumberFigures(md) {
	  const lines = md.split("\n");
	  let figureNumber = 0;

	  for (let i = 0; i < lines.length; i++) {
	    if (!/!\[[^\]]*\]\([^)]+\)/.test(lines[i])) continue;

	    figureNumber++;
	    lines[i] = lines[i].replace(/!\[[^\]]*\]\(([^)]+)\)/g, `![figure${figureNumber}.png]($1)`);

	    const captionIndex = i + 1;
	    if (captionIndex < lines.length && /^\s*\*?Figure\s+\d+\s*:/i.test(lines[captionIndex])) {
	      lines[captionIndex] = lines[captionIndex].replace(/Figure\s+\d+\s*:/i, `Figure ${figureNumber}:`);
	    }
	  }

	  return lines.join("\n");
	}

	insertImageButton.addEventListener("click", function() {
	  const url = imageSelect.value;
	  if (!url) return;

	  const imageName = getImageName(url);
	  cm.replaceSelection(`![${imageName}](${url})`);
	  cm.focus();
	});

	renumberFiguresButton.addEventListener("click", function() {
	  const md = firepadReady ? firepad.getText() : cm.getValue();
	  const nextMd = renumberFigures(md);

	  if (nextMd === md) return;
	  if (firepadReady) {
	    firepad.setText(nextMd);
	  } else {
	    cm.setValue(nextMd);
	  }
	  renderPreview();
	});

  /**************************************************
   * 6. Load test.md ONLY if empty
   **************************************************/
  firepad.on("ready", async function() {
    firepadReady=true;
    const existing = firepad.getText();

    if (!existing || !existing.trim()) {
      const res = await fetch("/test.md", { cache: "no-store" });
      if (res.ok) {
        const md = await res.text();
        firepad.setText(md);   // IMPORTANT: setText, not setHtml
      }
    }

    renderPreview();
  });

  /**************************************************
   * 7. Live Preview Updates
   **************************************************/
  cm.on("change", function() {
    renderPreview();
  });

}
</script>

</body>
</html>
